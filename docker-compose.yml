services:
  mysql:
    image: mysql:8.4
    container_name: junta-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: community_platform
      MYSQL_USER: junta
      MYSQL_PASSWORD: junta
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - junta_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql_testing:
    image: mysql:8.4
    container_name: junta-mysql-testing
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: testing_dusk
      MYSQL_USER: junta
      MYSQL_PASSWORD: junta
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - junta_mysql_testing_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: junta-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql

volumes:
  junta_mysql_data:
  junta_mysql_testing_data:
